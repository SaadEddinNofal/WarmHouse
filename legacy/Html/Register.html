<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Warm House</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<header>
    <nav class="navbar">

        <div class="logo">
            <img src="../images/minilogo.png" alt="Logo">
            <h2>Warm House</h2>
        </div>

        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="../index.html">Adoption</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>

    </nav>
</header>

<section class="auth-section">

    <div class="auth-container">

        <div class="auth-image">
            <img src="../images/logo.png" alt="Warm House">
        </div>

        <div class="auth-form">

            <h1>Create Account</h1>

            <p>
                Join our community and help animals find a loving home.
            </p>

            <form>

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name">
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email">
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create password">
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Confirm password">
                </div>

                <button type="submit" class="btn">
                    Register
                </button>

            </form>

            <div class="auth-link">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </div>

</section>

<footer>
    <div class="footer-content">
        <h3>Warm House</h3>
        <p>Helping animals find homes and helping families find companions.</p>
        <p>© 2026 Warm House. All Rights Reserved.</p>
    </div>
</footer>

</body>
</html>
